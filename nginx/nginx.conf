# ====================================================================
# Nginx Reverse Proxy & TLS Configuration for Coc Tre Huyen Duong
# ====================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Tối ưu tải trọng tải file ảnh & form báo giá
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Nén Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # 1. Chuyển hướng toàn bộ HTTP sang HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name coctrehuyenduong.com www.coctrehuyenduong.com;

        # Hỗ trợ xác thực Let's Encrypt Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Cấu hình HTTPS an toàn
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name coctrehuyenduong.com www.coctrehuyenduong.com;

        # Đường dẫn chứng chỉ SSL (Let's Encrypt hoặc Custom Certificate)
        ssl_certificate /etc/nginx/ssl/live/coctrehuyenduong.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/coctrehuyenduong.com/privkey.pem;

        # Cấu hình giao thức & mật mã bảo mật cao
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Reverse Proxy tới Next.js container
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Chuyển tiếp IP thực của client
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Cache tài nguyên tĩnh tối đa
        location /_next/static/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /images/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        }
    }
}
