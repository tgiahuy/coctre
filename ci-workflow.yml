# File cấu hình GitHub Actions CI/CD cho dự án Cọc Tre Huyền Dương
# Để kích hoạt tự động trên GitHub:
# 1. Truy cập repo trên GitHub -> Add file -> Create new file
# 2. Đặt đường dẫn: .github/workflows/ci.yml
# 3. Dán toàn bộ nội dung dưới đây và nhấn Commit changes
# (Hoặc cấp quyền "workflow" scope cho GitHub OAuth token / Personal Access Token của bạn)

name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Run unit & integration tests
        run: ./mvnw clean test --batch-mode

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
