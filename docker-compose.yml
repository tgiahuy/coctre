services:
  # 1. Cơ sở dữ liệu PostgreSQL (chỉ truy cập trong mạng nội bộ docker / localhost)
  postgres:
    image: postgres:16-alpine
    container_name: coctre_postgres
    restart: always
    environment:
      POSTGRES_DB: coctre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your environment}
    # Bảo mật: Chỉ lắng nghe trên 127.0.0.1 của host để quản trị viên truy cập nội bộ, KHÔNG mở ra internet công khai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - coctre_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coctre"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Backend Spring Boot (Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coctre_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    # Bảo mật: Chỉ lắng nghe trên 127.0.0.1 để Reverse Proxy (Nginx/Next.js) chuyển tiếp, không mở cổng trực tiếp ra internet
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/coctre
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your environment}
      APP_ADMIN_INITIAL_EMAIL: ${APP_ADMIN_INITIAL_EMAIL:-}
      APP_ADMIN_INITIAL_PASSWORD: ${APP_ADMIN_INITIAL_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,https://coctrehuyenduong.com,https://coctrehuyenduong.vn"
      APP_INTERNAL_SECRET: ${INTERNAL_SECRET:-coctre-internal-shared-secret-key-2026}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - coctre_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/v1/products || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # 3. Ứng dụng Frontend Next.js (Node.js 20)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coctre_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    # Bảo mật: Chỉ lắng nghe trên 127.0.0.1 của host để quản trị viên truy cập hoặc qua Nginx Reverse Proxy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "true"
      INTERNAL_SECRET: ${INTERNAL_SECRET:-coctre-internal-shared-secret-key-2026}
      BACKEND_API_URL: http://backend:8080
      BACKEND_INTERNAL_URL: http://backend:8080/api/v1
      INTERNAL_BACKEND_URL: http://backend:8080/api/v1
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-huyenduong70@gmail.com}

      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Cọc Tre Huyền Dương <onboarding@resend.dev>}
      UPLOAD_DIR: /app/public/uploads
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - coctre_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s


networks:
  coctre_network:
    driver: bridge

volumes:
  pgdata:
  uploads_data:
