# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Info
spring.application.name=coctre-backend

# Profiles: active profile (dev uses H2 in-memory or Postgres if configured)
spring.profiles.active=dev

# File Upload Limit (for images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,https://coctrehoabinh.com
app.admin.pin=8888
