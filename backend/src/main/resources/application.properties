# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Info
spring.application.name=coctre-backend

# Profiles: active profile (dev uses H2 in-memory or Postgres if configured)
spring.profiles.active=dev
spring.flyway.enabled=false


# File Upload Limit (for images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,https://coctrehuyenduong.com,https://coctrehuyenduong.vn
app.admin.initial-email=${APP_ADMIN_INITIAL_EMAIL:}
app.admin.initial-password=${APP_ADMIN_INITIAL_PASSWORD:}
app.internal-secret=${APP_INTERNAL_SECRET:coctre-internal-shared-secret-key-2026}

