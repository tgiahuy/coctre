services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: coctre_postgres
    restart: always
    environment:
      POSTGRES_DB: coctre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coctre"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Backend Spring Boot (Java 21)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coctre_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/coctre
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your environment}
      APP_ADMIN_INITIAL_EMAIL: ${APP_ADMIN_INITIAL_EMAIL:-}
      APP_ADMIN_INITIAL_PASSWORD: ${APP_ADMIN_INITIAL_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
